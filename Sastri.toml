[project]
name = "ditch"
description = "Delete regenerable build output from development projects."
github_owner = "baoulo"
github_repo = "ditch"
binary_name = "ditch"
version = "0.2.0"
cargo_manifest = "Cargo.toml"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/baoulo/ditch"

[org]
homebrew_tap = "baoulo/homebrew-tap"
scoop_bucket = "baoulo/scoop-bucket"
asdf_plugin_repo = "baoulo/asdf-ditch"

[mechanisms]
homebrew = true
scoop = true
asdf = true
mise = true
ci = false
github_releases = false
install_sh = false
setup_action = false
npm = false
pypi = false
hex = false
ruby_gem = false
haskell_cabal = false
